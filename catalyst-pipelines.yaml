# Catalyst Pipelines: deploys Brandfluence to Development on every push to main.
# Uses Catalyst's default build machine (Ubuntu with the Catalyst CLI pre-installed), so no Docker account is needed.
# Set these as Global Variables in the pipeline (Pipelines -> your pipeline -> Global configuration):
#   CATALYST_TOKEN     output of `catalyst token:generate` on your computer
#   CATALYST_ORG       60027750675
#   PROJECT_NAME       Brandfluence
#   SCHEDULER_SECRET   same value as in secrets.local.json
#   YOUTUBE_API_KEY, RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET,
#   TWITCH_CLIENT_ID, TWITCH_CLIENT_SECRET, IG_BUSINESS_ACCOUNT_ID, IG_ACCESS_TOKEN   (optional)
version: 1
runners:
  Machine:
    config-id: 2
jobs:
  Deploy_Brandfluence:
    steps:
      - node -v
      - catalyst -v
      - npm install --omit=dev --prefix functions/brandfluence_api
      - npm install --omit=dev --prefix functions/bf_scheduler
      - SCHEDULER_SECRET='<< env.SCHEDULER_SECRET >>' YOUTUBE_API_KEY='<< env.YOUTUBE_API_KEY >>' RAZORPAY_KEY_ID='<< env.RAZORPAY_KEY_ID >>' RAZORPAY_KEY_SECRET='<< env.RAZORPAY_KEY_SECRET >>' RAZORPAY_WEBHOOK_SECRET='<< env.RAZORPAY_WEBHOOK_SECRET >>' TWITCH_CLIENT_ID='<< env.TWITCH_CLIENT_ID >>' TWITCH_CLIENT_SECRET='<< env.TWITCH_CLIENT_SECRET >>' IG_BUSINESS_ACCOUNT_ID='<< env.IG_BUSINESS_ACCOUNT_ID >>' IG_ACCESS_TOKEN='<< env.IG_ACCESS_TOKEN >>' node scripts/with-secrets.js catalyst deploy --project << env.PROJECT_NAME >> --org << env.CATALYST_ORG >> --token << env.CATALYST_TOKEN >>
stages:
  - name: deploy
    jobs:
      - Deploy_Brandfluence
